<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .layer-label { font-size: 11px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.06em; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .box-accent { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .box-dark { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .box-ext { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; }
      .box-db { fill: #ecfdf5; stroke: #34d399; stroke-width: 1.5; }
      .label { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .label-light { font-size: 13px; font-weight: 600; fill: #f8fafc; }
      .detail { font-size: 10px; fill: #64748b; }
      .detail-light { font-size: 10px; fill: #cbd5e1; }
      .edge { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .edge-label { font-size: 9px; fill: #475569; font-family: ui-monospace, monospace; }
      .step { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; }
      .step-num { font-size: 10px; font-weight: 700; fill: #3b82f6; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" class="title">Accounting System - Architecture and Workflow</text>
  <text x="600" y="56" text-anchor="middle" class="subtitle">Multi-tenant bookkeeping | Next.js + Express + PostgreSQL | optional OCR, AI, OAuth, email</text>

  <!-- Layer bands -->
  <rect x="24" y="72" width="1152" height="88" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="40" y="92" class="layer-label">PRESENTATION</text>
  <rect x="24" y="168" width="1152" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="188" class="layer-label">APPLICATION</text>
  <rect x="24" y="376" width="1152" height="120" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="40" y="396" class="layer-label">DATA AND INTEGRATIONS</text>
  <rect x="24" y="512" width="1152" height="368" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="532" class="layer-label">DOMAIN AND RECEIPT WORKFLOW</text>

  <!-- User -->
  <rect x="520" y="88" width="160" height="48" rx="6" class="box"/>
  <text x="600" y="110" text-anchor="middle" class="label">Browser</text>
  <text x="600" y="124" text-anchor="middle" class="detail">Accountant / team member</text>

  <!-- Next.js -->
  <rect x="80" y="210" width="1040" height="72" rx="6" class="box-accent"/>
  <text x="600" y="232" text-anchor="middle" class="label">Next.js client (client/ | :3000)</text>
  <text x="600" y="248" text-anchor="middle" class="detail">AuthGate | SideNav | AIChatPanel | client/lib/api.ts</text>
  <text x="600" y="268" text-anchor="middle" class="detail">Pages: Dashboard | Bookkeeping | Receipts | Customers/Invoices | Vendors/Bills | Reports | Reconciliation | Login/Signup</text>

  <!-- Express -->
  <rect x="80" y="298" width="1040" height="56" rx="6" class="box-dark"/>
  <text x="600" y="320" text-anchor="middle" class="label-light">Express API (server/ | :8000)</text>
  <text x="600" y="338" text-anchor="middle" class="detail-light">CORS | rate limit on /api/auth | static /uploads | Prisma middleware (workspace scope)</text>

  <!-- Middleware strip -->
  <rect x="200" y="418" width="800" height="40" rx="6" class="box"/>
  <text x="600" y="442" text-anchor="middle" class="label">Every business route: requireAuth (JWT) | requireWorkspace (x-workspace-id) | route handler</text>

  <!-- API modules row -->
  <g transform="translate(48, 468)">
    <rect x="0" y="0" width="130" height="36" rx="4" class="box"/><text x="65" y="22" text-anchor="middle" class="detail">/api/auth</text>
    <rect x="138" y="0" width="130" height="36" rx="4" class="box"/><text x="203" y="22" text-anchor="middle" class="detail">/api/workspaces</text>
    <rect x="276" y="0" width="130" height="36" rx="4" class="box"/><text x="341" y="22" text-anchor="middle" class="detail">accounts | JE</text>
    <rect x="414" y="0" width="130" height="36" rx="4" class="box"/><text x="479" y="22" text-anchor="middle" class="detail">receipts</text>
    <rect x="552" y="0" width="130" height="36" rx="4" class="box"/><text x="617" y="22" text-anchor="middle" class="detail">customers | invoices</text>
    <rect x="690" y="0" width="130" height="36" rx="4" class="box"/><text x="755" y="22" text-anchor="middle" class="detail">vendors | bills</text>
    <rect x="828" y="0" width="130" height="36" rx="4" class="box"/><text x="893" y="22" text-anchor="middle" class="detail">reconciliation</text>
    <rect x="966" y="0" width="130" height="36" rx="4" class="box"/><text x="1031" y="22" text-anchor="middle" class="detail">reports | ai | recurring</text>
  </g>

  <!-- Vertical flow user -> client -> api -->
  <line x1="600" y1="136" x2="600" y2="210" class="edge"/>
  <line x1="600" y1="282" x2="600" y2="298" class="edge"/>
  <line x1="600" y1="354" x2="600" y2="418" class="edge"/>

  <!-- Client to API -->
  <text x="612" y="200" class="edge-label">HTTPS</text>
  <text x="612" y="378" class="edge-label">REST | Bearer JWT | x-workspace-id</text>

  <!-- External services -->
  <rect x="48" y="548" width="168" height="64" rx="6" class="box-db"/>
  <text x="132" y="572" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="132" y="588" text-anchor="middle" class="detail">Prisma ORM | all ledger data</text>

  <rect x="240" y="548" width="168" height="64" rx="6" class="box-ext"/>
  <text x="324" y="572" text-anchor="middle" class="label">OCR service</text>
  <text x="324" y="588" text-anchor="middle" class="detail">Flask + Tesseract | :5001</text>

  <rect x="432" y="548" width="168" height="64" rx="6" class="box-ext"/>
  <text x="516" y="572" text-anchor="middle" class="label">Groq / OpenAI</text>
  <text x="516" y="588" text-anchor="middle" class="detail">AI chat | receipt parse</text>

  <rect x="624" y="548" width="168" height="64" rx="6" class="box-ext"/>
  <text x="708" y="572" text-anchor="middle" class="label">Google OAuth</text>
  <text x="708" y="588" text-anchor="middle" class="detail">optional sign-in</text>

  <rect x="816" y="548" width="168" height="64" rx="6" class="box-ext"/>
  <text x="900" y="572" text-anchor="middle" class="label">SMTP</text>
  <text x="900" y="588" text-anchor="middle" class="detail">invoice email | Nodemailer</text>

  <rect x="1008" y="548" width="144" height="64" rx="6" class="box"/>
  <text x="1080" y="572" text-anchor="middle" class="label">File storage</text>
  <text x="1080" y="588" text-anchor="middle" class="detail">server/uploads</text>

  <!-- API to integrations -->
  <path d="M 600 458 L 600 520 L 132 520 L 132 548" class="edge"/>
  <path d="M 600 520 L 324 520 L 324 548" class="edge"/>
  <path d="M 600 520 L 516 520 L 516 548" class="edge"/>
  <path d="M 600 520 L 708 520 L 708 548" class="edge"/>
  <path d="M 600 520 L 900 520 L 900 548" class="edge"/>
  <path d="M 600 520 L 1080 520 L 1080 548" class="edge"/>

  <!-- Domain hub -->
  <rect x="420" y="640" width="360" height="56" rx="28" class="box-accent"/>
  <text x="600" y="664" text-anchor="middle" class="label">Workspace (tenant)</text>
  <text x="600" y="680" text-anchor="middle" class="detail">User | WorkspaceMember | invites | PERSONAL / TEAM</text>

  <rect x="48" y="728" width="160" height="52" rx="6" class="box"/>
  <text x="128" y="750" text-anchor="middle" class="label">General ledger</text>
  <text x="128" y="766" text-anchor="middle" class="detail">Account | JournalEntry | Receipt</text>

  <rect x="228" y="728" width="160" height="52" rx="6" class="box"/>
  <text x="308" y="750" text-anchor="middle" class="label">Receivables</text>
  <text x="308" y="766" text-anchor="middle" class="detail">Customer | Invoice</text>

  <rect x="408" y="728" width="160" height="52" rx="6" class="box"/>
  <text x="488" y="750" text-anchor="middle" class="label">Payables</text>
  <text x="488" y="766" text-anchor="middle" class="detail">Vendor | Bill | recurring</text>

  <rect x="588" y="728" width="160" height="52" rx="6" class="box"/>
  <text x="668" y="750" text-anchor="middle" class="label">Banking</text>
  <text x="668" y="766" text-anchor="middle" class="detail">BankTransaction | Reconciliation</text>

  <rect x="768" y="728" width="160" height="52" rx="6" class="box"/>
  <text x="848" y="750" text-anchor="middle" class="label">Reporting</text>
  <text x="848" y="766" text-anchor="middle" class="detail">P&amp;L | balance sheet | KPIs</text>

  <rect x="948" y="728" width="204" height="52" rx="6" class="box"/>
  <text x="1050" y="750" text-anchor="middle" class="label">Posting links</text>
  <text x="1050" y="766" text-anchor="middle" class="detail">Invoice/Bill/Receipt | JournalEntry</text>

  <line x1="600" y1="696" x2="128" y2="728" class="edge" marker-end="url(#arrow)"/>
  <line x1="600" y1="696" x2="308" y2="728" class="edge"/>
  <line x1="600" y1="696" x2="488" y2="728" class="edge"/>
  <line x1="600" y1="696" x2="668" y2="728" class="edge"/>
  <line x1="600" y1="696" x2="848" y2="728" class="edge"/>
  <line x1="600" y1="696" x2="1050" y2="728" class="edge"/>
  <line x1="132" y1="612" x2="600" y2="640" class="edge" stroke-dasharray="4 3"/>

  <!-- Receipt workflow -->
  <text x="48" y="812" class="label">Receipt end-to-end workflow</text>
  <g transform="translate(48, 822)">
    <rect x="0" y="0" width="118" height="44" rx="6" class="step"/>
    <text x="12" y="18" class="step-num">1</text>
    <text x="59" y="20" text-anchor="middle" class="detail">Upload image</text>
    <text x="59" y="34" text-anchor="middle" class="detail">POST /api/receipts</text>

    <text x="128" y="26" class="detail">|</text>

    <rect x="140" y="0" width="118" height="44" rx="6" class="step"/>
    <text x="152" y="18" class="step-num">2</text>
    <text x="199" y="20" text-anchor="middle" class="detail">OCR text</text>
    <text x="199" y="34" text-anchor="middle" class="detail">Tesseract /extract</text>

    <text x="268" y="26" class="detail">|</text>

    <rect x="280" y="0" width="118" height="44" rx="6" class="step"/>
    <text x="292" y="18" class="step-num">3</text>
    <text x="339" y="20" text-anchor="middle" class="detail">Parse fields</text>
    <text x="339" y="34" text-anchor="middle" class="detail">GPT or regex</text>

    <text x="408" y="26" class="detail">|</text>

    <rect x="420" y="0" width="118" height="44" rx="6" class="step"/>
    <text x="432" y="18" class="step-num">4</text>
    <text x="479" y="20" text-anchor="middle" class="detail">Receipt row</text>
    <text x="479" y="34" text-anchor="middle" class="detail">extractedData JSON</text>

    <text x="548" y="26" class="detail">|</text>

    <rect x="560" y="0" width="118" height="44" rx="6" class="step"/>
    <text x="572" y="18" class="step-num">5</text>
    <text x="619" y="20" text-anchor="middle" class="detail">Review</text>
    <text x="619" y="34" text-anchor="middle" class="detail">approve / reject</text>

    <text x="688" y="26" class="detail">|</text>

    <rect x="700" y="0" width="160" height="44" rx="6" class="step"/>
    <text x="712" y="18" class="step-num">6</text>
    <text x="780" y="20" text-anchor="middle" class="detail">Post to books</text>
    <text x="780" y="34" text-anchor="middle" class="detail">JournalEntry and/or Bill</text>
  </g>

  <!-- Auth mini flow -->
  <rect x="900" y="822" width="276" height="44" rx="6" fill="#fefce8" stroke="#eab308"/>
  <text x="1038" y="840" text-anchor="middle" class="detail" font-weight="600" fill="#713f12">Auth: signup/login/Google | JWT | workspace header | scoped CRUD</text>
  <text x="1038" y="856" text-anchor="middle" class="detail" fill="#854d0e">Deploy: Vercel (client) | Render (API) | managed Postgres</text>

  <text x="24" y="888" class="detail">Export: open this SVG in a browser or Preview, then File | Export as PNG (1200|900).</text>
</svg>
